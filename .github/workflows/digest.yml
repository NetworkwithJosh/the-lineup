name: Weekly email

on:
  schedule:
    - cron: "23 11 * * 1"   # Mondays, about 6:20 AM New York time, after the daily refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send each member their state's week
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_ADDRESS: ${{ vars.MAIL_ADDRESS }}
        run: python scraper/mailer.py digest
