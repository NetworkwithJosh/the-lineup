name: Refresh the lineup

on:
  schedule:
    - cron: "17 10 * * *"   # every day, ~5-6am New York time
    - cron: "41 21 * * *"   # and again late afternoon, so new listings show up the same day
  workflow_dispatch:         # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull the feeds
        run: python scraper/scrape.py --days 180
      - name: Sync events to accounts database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/supabase_sync.py
      - name: Ping search engines (IndexNow)
        run: python scraper/indexnow.py
      - name: Save the new events
        run: |
          git config user.name "lineup-bot"
          git config user.email "lineup-bot@users.noreply.github.com"
          git add site/data/events.json site/lineup.ics site/sitemap.xml site/e site/us site/feeds site/event site/account site/unsubscribe site/privacy site/terms scraper/geocache.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh events"
            git pull --rebase origin main && git push || echo "Push skipped; the site still deploys from this run"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # GitHub's Pages service sometimes can't see a fresh upload yet. Try again before giving up,
      # so one hiccup never leaves the site stale until the next refresh.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait a minute if the publish hiccuped
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Upload again under a new name
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-retry
      - if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-retry
